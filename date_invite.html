<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Question For You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111111;
      padding: 2rem 1rem;
      position: relative;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 2;
      background: #1a1a1a;
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 2.75rem 2.5rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    .icon-row {
      font-size: 32px;
      margin-bottom: 1.5rem;
      letter-spacing: 6px;
    }

    .headline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 26px;
      font-weight: 400;
      color: #f0ece8;
      line-height: 1.35;
      margin-bottom: 0.75rem;
    }

    .subline {
      font-size: 14px;
      color: rgba(240, 236, 232, 0.5);
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .divider {
      width: 40px;
      height: 0.5px;
      background: rgba(255,255,255,0.15);
      margin: 1.25rem auto;
    }

    .btn-yes {
      background: #2a2a2a;
      color: #f0ece8;
      border: 0.5px solid rgba(255,255,255,0.2);
      padding: 13px 0;
      border-radius: 8px;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
      display: block;
      width: 100%;
      margin-bottom: 12px;
    }
    .btn-yes:hover { background: #3a3a3a; border-color: rgba(255,255,255,0.35); }
    .btn-yes:active { transform: scale(0.98); }

    .no-wrapper { position: relative; height: 42px; }

    .btn-no {
      position: absolute;
      background: transparent;
      color: rgba(240, 236, 232, 0.25);
      border: 0.5px solid rgba(255,255,255,0.08);
      padding: 9px 28px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      transition: color 0.15s;
    }
    .btn-no:hover { color: rgba(240,236,232,0.4); }

    .toast {
      display: none;
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: #2a2a2a;
      border: 0.5px solid rgba(255,255,255,0.12);
      color: rgba(240,236,232,0.7);
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 13px;
      font-style: italic;
      white-space: nowrap;
      z-index: 100;
      animation: fadeUp 0.3s ease;
    }
    .toast.show { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateX(-50%) translateY(6px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .yes-msg {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      animation: fadeIn 0.5s ease;
    }
    .yes-msg.show { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .yes-headline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 24px;
      font-weight: 400;
      color: #f0ece8;
      line-height: 1.35;
    }

    .yes-sub {
      font-size: 14px;
      color: rgba(240,236,232,0.5);
      line-height: 1.7;
      max-width: 300px;
    }
  </style>
</head>
<body>

  <canvas id="petalsCanvas"></canvas>

  <div class="card">
    <div id="invite-content">
      <div class="icon-row">🥩 🍷</div>
      <p class="headline">Steak &amp; wine night?</p>
      <div class="divider"></div>
      <p class="subline">Good food. Good wine.<br>Even better company — if you're in.</p>

      <button class="btn-yes" onclick="sayYes()">I'm in</button>

      <div class="no-wrapper">
        <button class="btn-no" id="btn-no" onmouseenter="moveNo(this)" onclick="noClick()">No thanks</button>
      </div>
    </div>

    <div class="yes-msg" id="yes-msg">
      <div style="font-size:40px;margin-bottom:0.25rem">🥂</div>
      <div class="divider"></div>
      <p class="yes-headline">That's what I like to hear.</p>
      <p class="yes-sub">I'm excited — text me when you're in town and we'll make it happen.</p>
    </div>
  </div>

  <div class="toast" id="toast">There is no choice.</div>

  <script>
    const canvas = document.getElementById('petalsCanvas');
    const ctx = canvas.getContext('2d');
    let petals = [];
    let W, H;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function newPetal() {
      return {
        x: Math.random() * W,
        y: -16,
        size: Math.random() * 6 + 4,
        speedY: Math.random() * 0.7 + 0.3,
        speedX: (Math.random() - 0.5) * 0.5,
        opacity: Math.random() * 0.55 + 0.2,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.025,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: Math.random() * 0.025 + 0.008,
        hue: Math.random() < 0.7 ? '#c0324a' : '#e05070'
      };
    }

    function drawPetal(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = p.opacity;
      ctx.fillStyle = p.hue;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size * 0.5, p.size, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, W, H);
      if (Math.random() < 0.12) petals.push(newPetal());
      if (petals.length > 70) petals.splice(0, 1);
      petals.forEach(p => {
        p.wobble += p.wobbleSpeed;
        p.x += p.speedX + Math.sin(p.wobble) * 0.4;
        p.y += p.speedY;
        p.rotation += p.rotSpeed;
        if (p.y > H + 16) p.y = -16;
        drawPetal(p);
      });
      requestAnimationFrame(animate);
    }

    resize();
    animate();
    window.addEventListener('resize', resize);

    function moveNo(el) {
      const wrapper = document.querySelector('.no-wrapper');
      const wW = wrapper.offsetWidth;
      const bW = el.offsetWidth || 90;
      el.style.left = (Math.random() * (wW - bW)) + 'px';
      el.style.transform = 'none';
    }

    function noClick() {
      const toast = document.getElementById('toast');
      toast.classList.remove('show');
      void toast.offsetWidth;
      toast.classList.add('show');
      moveNo(document.getElementById('btn-no'));
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function sayYes() {
      document.getElementById('invite-content').style.display = 'none';
      document.getElementById('yes-msg').classList.add('show');
      for (let i = 0; i < 30; i++) {
        setTimeout(() => {
          const p = newPetal();
          p.x = Math.random() * W;
          p.y = Math.random() * H * 0.4;
          p.opacity = Math.random() * 0.7 + 0.3;
          petals.push(p);
        }, i * 50);
      }
    }
  </script>
</body>
</html>
